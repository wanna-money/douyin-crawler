server {
    listen 80;
    server_name _;  # 替换为你的域名，如 example.com

    # 日志
    access_log /var/log/nginx/douyin-crawler.access.log;
    error_log  /var/log/nginx/douyin-crawler.error.log;

    # 代理到 FastAPI 服务
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket 支持（APScheduler 不需要，但留着无害）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 转发真实客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（采集任务可能耗时较长）
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # 静态资源缓存（前端 JS/CSS）
    location /assets/ {
        proxy_pass http://127.0.0.1:8000/assets/;
        expires    7d;
        add_header Cache-Control "public, immutable";
    }
}
