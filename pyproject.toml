[project]
name = "douyin-crawler"
version = "0.1.0"
description = "抖音内容采集与飞书推送系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.9",
    "playwright>=1.60.0",
    "pyexecjs>=1.5.1",
    "playwright-stealth>=2.0.3",
]

[project.scripts]
server = "backend.main:start"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anyio>=4.13.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
